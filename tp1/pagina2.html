<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deportes Unca - Inscripción a una actividad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <header>
        <div class="container-fluid">
            <h1>Inscripción a una actividad</h1>
            <nav>
                <ul>
                    <li><a href="pagina1.html">Inicio</a></li>
                    <li><a href="pagina1.html#actividades">Actividades deportivas</a></li>
                    <li><a href="inscripciones.html">Mis inscripciones</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <form action="pagina3.html" method="post" id="formulario-inscripcion" class="mt-4" onsubmit="return validarFormulario(event)">

            <section class="tarjeta-formulario mb-4">
                <h2>Información de la actividad</h2>

                <div class="mb-3">
                    <label for="actividad" class="form-label">Actividad:</label>
                    <input type="text" id="actividad" name="actividad" value="Fútbol" class="form-control" disabled>
                </div>

                <div class="mb-3">
                    <label for="lugar" class="form-label">Lugar:</label>
                    <input type="text" id="lugar" name="lugar" value="Cancha Universitaria" class="form-control" disabled>
                </div>

                <div class="mb-3">
                    <label for="dia" class="form-label">Día:</label>
                    <input type="text" id="dia" name="dia" value="Lunes" class="form-control" disabled>
                </div>

                <div class="mb-3">
                    <label for="horario" class="form-label">Horario:</label>
                    <input type="text" id="horario" name="horario" value="18:00-20:00" class="form-control" disabled>
                </div>
            </section>

            <section class="tarjeta-formulario mb-4">
                <h2>Generación de participantes</h2>
                <div class="mb-3 d-flex align-items-end gap-3">
                    <div>
                        <label for="cantidadParticipantes" class="form-label">Cantidad de participantes:</label>
                        <input type="number" id="cantidadParticipantes" class="form-control" min="1" max="10">
                    </div>
                    <button type="button" class="btn btn-info text-white" onclick="generarParticipantes()">Generar participantes</button>
                </div>

                <div id="contenedorParticipantes"></div>
            </section>

            <section class="tarjeta-formulario mb-4">
                <h2>Información adicional</h2>
                
                <fieldset class="mb-3">
                    <legend class="col-form-label pt-0">¿Posee experiencia previa?</legend>
                    <div class="form-check form-check-inline">
                        <input type="radio" id="experiencia_si" name="experiencia" value="Si" class="form-check-input">
                        <label for="experiencia_si" class="form-check-label">Sí</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input type="radio" id="experiencia_no" name="experiencia" value="No" class="form-check-input">
                        <label for="experiencia_no" class="form-check-label">No</label>
                    </div>
                </fieldset>

                <div class="mb-3">
                    <label for="observaciones" class="form-label">Observaciones:</label>
                    <textarea id="observaciones" name="observaciones" rows="4" class="form-control"></textarea>
                </div>
            </section>

            <section class="mb-4">
                <div class="form-check">
                    <input type="checkbox" id="condiciones" name="condiciones" class="form-check-input" required>
                    <label for="condiciones" class="form-check-label">Acepto las condiciones de inscripción</label>
                </div>
            </section>

            <section class="mb-5 text-center">
                <button type="submit" class="btn btn-primary btn-lg px-4 me-2">Aceptar</button>
                <button type="reset" class="btn btn-secondary btn-lg px-4">Cancelar</button>
            </section>

        </form>
    </main>

    <footer class="mt-auto">
        <div class="container">
            <p>Deportes Unca &ndash; 2026</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
