<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Deportes Unca - Inscripción a una actividad</title>
</head>
<body>

    <header>
        <h1>Inscripción a una actividad</h1>
        <nav>
            <ul>
                <li><a href="pagina1.html">Inicio</a></li>
                <li><a href="pagina1.html#actividades">Actividades deportivas</a></li>
                <li><a href="inscripciones.html">Mis inscripciones</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <form action="pagina3.html" method="post">

            <section>
                <h2>Información de la actividad</h2>

                <label for="actividad">Actividad:</label>
                <input type="text" id="actividad" name="actividad" value="Futbol" disabled>
                <br>

                <label for="lugar">Lugar:</label>
                <input type="text" id="lugar" name="lugar" value="Cancha techada" disabled>
                <br>

                <label for="dia">Día:</label>
                <input type="text" id="dia" name="dia" value="Martes y jueves" disabled>
                <br>

                <label for="horario">Horario:</label>
                <input type="text" id="horario" name="horario" value="18:00 - 19:30" disabled>
            </section>

            <section>
                <h2>Datos del participante</h2>

                <label for="nombre">Apellido y nombre:</label>
                <input type="text" id="nombre" name="nombre" maxlength="100" required>
                <br>

                <label for="dni">DNI:</label>
                <input type="text" id="dni" name="dni" minlength="8" maxlength="8" required>
                <br>

                <label for="fecha_nacimiento">Fecha de nacimiento:</label>
                <input type="date" id="fecha_nacimiento" name="fecha_nacimiento">
                <br>

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email">
                <br>

                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono">
                <br>

                <fieldset>
                    <legend>Sexo:</legend>

                    <input type="radio" id="sexo_f" name="sexo" value="Femenino">
                    <label for="sexo_f">Femenino</label>

                    <input type="radio" id="sexo_m" name="sexo" value="Masculino">
                    <label for="sexo_m">Masculino</label>

                    <input type="radio" id="sexo_nb" name="sexo" value="No binario">
                    <label for="sexo_nb">No binario</label>
                </fieldset>
            </section>

            <section>
                <h2>Información deportiva</h2>

                <label for="nivel">Nivel:</label>
                <select id="nivel" name="nivel">
                    <option value="inicial">Inicial</option>
                    <option value="intermedio">Intermedio</option>
                    <option value="avanzado">Avanzado</option>
                </select>
                <br>

                <fieldset>
                    <legend>¿Posee experiencia previa?</legend>

                    <input type="radio" id="experiencia_si" name="experiencia" value="Si">
                    <label for="experiencia_si">Sí</label>

                    <input type="radio" id="experiencia_no" name="experiencia" value="No">
                    <label for="experiencia_no">No</label>
                </fieldset>

                <label for="observaciones">Observaciones:</label>
                <br>
                <textarea id="observaciones" name="observaciones" rows="4" cols="40"></textarea>
            </section>

            <section>
                <h2>Aceptación de condiciones</h2>

                <input type="checkbox" id="condiciones" name="condiciones" required>
                <label for="condiciones">Acepto las condiciones de inscripción</label>
            </section>

            <section>
                <button type="submit">Aceptar</button>
                <button type="reset">Cancelar</button>
            </section>

        </form>
    </main>

    <footer>
        <p>Deportes Unca &ndash; 2026</p>
    </footer>

</body>
</html>
