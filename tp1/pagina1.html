<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deportes Unca</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <header>
        <div class="container-fluid">
            <h1>Deportes Unca</h1>
            <p>Plataforma de actividades deportivas</p>
            <nav>
                <ul>
                    <li><a href="pagina1.html">Inicio</a></li>
                    <li><a href="registro.html">Registrarse</a></li>
                    <li><a href="#actividades">Actividades deportivas</a></li>
                    <li><a href="pagina2.html">Inscribirse a una actividad</a></li>
                    <li><a href="inscripciones.html">Mis inscripciones</a></li>
                    <li><a href="login.html">Iniciar sesión</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        <section id="actividades" class="mt-4">
            <h2 class="mb-4 text-center">Actividades deportivas</h2>
            
            <div class="table-responsive">
                <table id="tablaActividades" class="table table-striped table-hover border">
                    <thead class="table-dark">
                        <tr>
                            <th>Actividad</th>
                            <th>Lugar</th>
                            <th>Día</th>
                            <th>Horario</th>
                            <th>Cupos</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="cuerpoTabla">
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="mt-auto">
        <div class="container">
            <p>Deportes Unca &ndash; 2026</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
